<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSMP 현황판</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#1b2430; --muted:#5a6b7b; --line:#e2e8f0;
    --accent:#2d6cdf; --done:#1f9d55; --prog:#d98500; --wait:#7a8a99; --risk:#d6453d;
    --chip:#eef2f7;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f141a; --panel:#18212b; --ink:#e7edf3; --muted:#9fb0c0; --line:#263341;
      --accent:#5a94ff; --done:#3ec37a; --prog:#f0a93b; --wait:#8496a6; --risk:#f0675f;
      --chip:#212c38;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f141a; --panel:#18212b; --ink:#e7edf3; --muted:#9fb0c0; --line:#263341;
    --accent:#5a94ff; --done:#3ec37a; --prog:#f0a93b; --wait:#8496a6; --risk:#f0675f;
    --chip:#212c38;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Pretendard,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 16px 60px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:6px}
  h1{font-size:1.45rem;margin:0;letter-spacing:-.01em}
  .meta{color:var(--muted);font-size:.84rem;display:flex;gap:10px;align-items:center}
  .live{display:inline-flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--done);display:inline-block;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .lede{color:var(--muted);font-size:.9rem;margin:0 0 22px;max-width:72ch}
  section{margin:26px 0}
  h2{font-size:1.05rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  h2 .bar{width:4px;height:18px;background:var(--accent);border-radius:2px;display:inline-block}
  .grid{display:grid;gap:12px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .scards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
  .card h3{margin:0 0 8px;font-size:.98rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card p{margin:4px 0;font-size:.86rem;color:var(--muted)}
  .badge{font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .b-done{color:var(--done);background:color-mix(in srgb,var(--done) 14%,transparent)}
  .b-run,.b-prog{color:var(--prog);background:color-mix(in srgb,var(--prog) 15%,transparent)}
  .b-wait{color:var(--wait);background:color-mix(in srgb,var(--wait) 16%,transparent)}
  .b-risk{color:var(--risk);background:color-mix(in srgb,var(--risk) 14%,transparent)}
  .dates{display:flex;flex-wrap:wrap;gap:8px}
  .date{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.85rem;min-width:132px}
  .date b{display:block;font-size:.95rem;color:var(--ink)}
  .date span{color:var(--muted)}
  .prog{display:flex;align-items:center;gap:9px;margin-top:10px}
  .prog-line{flex:1;height:10px;background:var(--chip);border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .prog-line i{display:block;height:100%;background:var(--accent);border-radius:4px 0 0 4px;transition:width .4s}
  .pct{font-size:.82rem;font-weight:700;color:var(--accent);min-width:38px;text-align:right}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .prog-line{background:#0c1117} }
  :root[data-theme="dark"] .prog-line{background:#0c1117}
  /* 신 교수 할 일 체크리스트 */
  .todocard{margin-bottom:12px}
  .todolist{list-style:none;margin:6px 0 0;padding:0}
  .todolist li{border-top:1px dashed var(--line);padding:9px 0}
  .todolist li:first-child{border-top:none}
  .todolist label{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:.9rem;color:var(--ink)}
  .todolist input{width:18px;height:18px;accent-color:var(--accent);flex:none;cursor:pointer}
  .tlabel{font-weight:600}
  .twhen{margin-left:auto;font-size:.76rem;color:var(--muted);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap}
  .tnote{margin:4px 0 0 27px;font-size:.81rem;color:var(--muted)}
  .todolist li.tdone .tlabel{text-decoration:line-through;color:var(--muted)}
  .todolist li.tdone{opacity:.6}
  .thint{margin:11px 0 0;font-size:.77rem;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
  .scard .nm{font-weight:600;font-size:.96rem;color:var(--ink)}
  .scard .mach{font-size:.7rem;color:var(--muted);font-weight:700;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:6px}
  .scard .role{font-size:.82rem;color:var(--muted);margin:5px 0 8px}
  .ctx{color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:.76rem;white-space:nowrap}
  .summary{display:flex;gap:16px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.88rem;color:var(--muted)}
  .summary b{color:var(--ink);font-size:1rem}
  .summary .s-work b{color:var(--prog)} .summary .s-done b{color:var(--done)} .summary .s-wait b{color:var(--wait)}
  .issues{list-style:none;margin:0;padding:0}
  .issues li{font-size:.85rem;padding:5px 0 5px 16px;position:relative;border-top:1px dashed var(--line)}
  .issues li:first-child{border-top:none}
  .issues li::before{content:"";position:absolute;left:3px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .note{color:var(--muted);font-size:.78rem;margin-top:34px;border-top:1px solid var(--line);padding-top:14px}
  .err{color:var(--risk);font-size:.85rem}
  @media (max-width:560px){ .date{flex:1 1 44%} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>DSMP 학기 마무리 현황판</h1>
    <div class="meta">
      <span class="live"><span class="dot"></span>자동 갱신</span>
      <span id="updated"></span>
    </div>
  </header>
  <p class="lede">7·8장은 <b>영상을 담은 강의노트</b>를 준비하고, 기말 과제를 설계·채점합니다. 여러 세션이 나눠 진행하며, 세션마다 지금의 쟁점을 보여 줍니다. 공개 주소라 세부 설계·채점 내용·비밀 값·개인 정보는 담지 않았습니다.</p>

  <section>
    <h2><span class="bar"></span>핵심 기한</h2>
    <div class="dates" id="dates"></div>
  </section>

  <section>
    <h2><span class="bar"></span>장별 진행</h2>
    <div class="grid cards" id="chapters"></div>
  </section>

  <section>
    <h2><span class="bar"></span>세션별 진행</h2>
    <div class="summary" id="ssummary"></div>
    <div id="todos"></div>
    <div class="grid scards" id="sessions"></div>
  </section>

  <p class="note" id="note"></p>
</div>
<script>
  var REFRESH_MS = 30000;
  var el = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); };
  var badgeText = { done:'완료', work:'작업 중', run:'작업 중', wait:'대기', prog:'진행', risk:'주의' };
  var lastUpdated = '';

  function getChk(id){ try{ return localStorage.getItem('dsmp_todo_'+id)==='1'; }catch(e){ return false; } }
  function setChk(id,v){ try{ if(v){ localStorage.setItem('dsmp_todo_'+id,'1'); } else { localStorage.removeItem('dsmp_todo_'+id); } }catch(e){} }

  function renderTodos(todos){
    todos = todos||[];
    if(!todos.length){ el('todos').innerHTML=''; return; }
    var done=0;
    var rows = todos.map(function(t){
      var on = getChk(t.id); if(on) done++;
      return '<li class="todo'+(on?' tdone':'')+'">'
        + '<label><input type="checkbox" data-id="'+esc(t.id)+'"'+(on?' checked':'')+'>'
        + '<span class="tlabel">'+esc(t.label)+'</span>'
        + '<span class="twhen">'+esc(t.when||'')+'</span></label>'
        + (t.note?'<p class="tnote">'+esc(t.note)+'</p>':'')
        + '</li>';
    }).join('');
    el('todos').innerHTML = '<div class="card todocard">'
      + '<h3><span class="nm">신 교수 할 일</span>'
      + '<span class="badge b-prog" id="tbadge">'+done+' / '+todos.length+'</span></h3>'
      + '<ul class="todolist">'+rows+'</ul>'
      + '<p class="thint">※ 체크는 이 브라우저에만 기억됩니다(기기·브라우저마다 따로). 끝낸 일을 모든 기기와 세션에 반영하려면 총괄에게 말씀해 주시면 목록에서 지우겠습니다.</p>'
      + '</div>';
  }

  function render(d){
    // 기한
    el('dates').innerHTML = (d.deadlines||[]).map(function(x){
      return '<div class="date"><b>'+esc(x.label)+'</b><span>'+esc(x.when)+'</span></div>';
    }).join('');
    // 장별
    el('chapters').innerHTML = (d.chapters||[]).map(function(c){
      var st = c.status||'prog';
      return '<div class="card"><h3>'+esc(c.name)+' <span class="badge b-'+st+'">'+(badgeText[st]||st)+'</span></h3>'
        + (c.lines||[]).map(function(l){ return '<p>'+esc(l)+'</p>'; }).join('')
        + '<div class="prog"><div class="prog-line"><i style="width:'+(c.pct||0)+'%"></i></div><span class="pct">'+(c.pct||0)+'%</span></div></div>';
    }).join('');
    // 세션별 쟁점 + 집계
    var ss = d.sessions||[];
    var cnt = { work:0, wait:0, done:0 };
    ss.forEach(function(s){ var k=s.state||'work'; if(cnt[k]!==undefined) cnt[k]++; });
    el('ssummary').innerHTML = '<span class="s-work">작업 중 <b>'+cnt.work+'</b></span>'
      + '<span class="s-wait">대기 <b>'+cnt.wait+'</b></span>'
      + '<span class="s-done">완료 <b>'+cnt.done+'</b></span>';
    el('sessions').innerHTML = ss.map(function(s){
      var st = s.state||'work';
      return '<div class="card scard">'
        + '<h3><span class="nm"><span class="mach">'+esc(s.machine)+'</span>'+esc(s.name)+'</span>'
        + '<span class="badge b-'+st+'">'+(badgeText[st]||st)+'</span></h3>'
        + '<div class="role">'+esc(s.role||'')+' · <span class="ctx">맥락 '+esc(s.ctx||'—')+'</span></div>'
        + '<ul class="issues">'+(s.issues||[]).map(function(i){ return '<li>'+esc(i)+'</li>'; }).join('')+'</ul>'
        + '</div>';
    }).join('');
    renderTodos(d.todos);
    lastUpdated = d.updated||'';
    el('note').textContent = '※ 가동 여부·맥락 %는 각 세션의 마지막 보고 기준입니다(에어 세션은 다른 기기라 직접 못 읽어 물어서 받고, 맥락 미보고는 —). 공개 주소라 기말 채점의 변별 방법·세부 설계, 비밀 값, 개인 정보는 담지 않았습니다. 데이터 갱신: ' + lastUpdated + ' · 페이지는 ' + (REFRESH_MS/1000) + '초마다 다시 읽음.';
    tick();
  }

  function tick(){
    if(!lastUpdated){ el('updated').textContent=''; return; }
    el('updated').textContent = '데이터 ' + lastUpdated;
  }

  function load(){
    fetch('data.json?t=' + Date.now(), { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function(e){ el('note').innerHTML = '<span class="err">데이터를 불러오지 못했습니다 ('+esc(e.message)+'). 잠시 뒤 다시 시도합니다.</span>'; });
  }

  el('todos').addEventListener('change', function(e){
    var cb = e.target;
    if(!cb || cb.type !== 'checkbox') return;
    var id = cb.getAttribute('data-id'); if(!id) return;
    setChk(id, cb.checked);
    var li = cb.closest('li.todo');
    if(li) li.classList.toggle('tdone', cb.checked);
    var b = el('tbadge');
    if(b){
      var boxes = document.querySelectorAll('#todos input[type=checkbox]');
      var n = 0; boxes.forEach(function(x){ if(x.checked) n++; });
      b.textContent = n + ' / ' + boxes.length;
    }
  });

  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
